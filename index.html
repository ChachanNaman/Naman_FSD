<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="style.css">

    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="script.js" defer></script>
</head>
<body>

<h2 id="title">Student Registration Form</h2>

<form id="regForm">
    <label>Username</label>
    <input type="text" id="username" class="inputField"><br>

    <label>Email</label>
    <input type="text" id="email" class="inputField"><br>

    <label>Phone Number</label>
    <input type="text" id="phone" class="inputField"><br>

    <label>Password</label>
    <input type="password" id="password" class="inputField"><br>

    <label>Confirm Password</label>
    <input type="password" id="confirmPassword" class="inputField"><br>

    <button type="button" id="submitBtn" onclick="validateForm()">Register</button>
</form>

<p id="message"></p>

<!-- Image for DOM manipulation -->
<img id="myImage" src="IMG_2602.jpg" width="150"><br>
<button onclick="changeImage()">Change Image</button>

<br><br>
<button id="jqBtn">jQuery Button</button>

</body>
</html>
